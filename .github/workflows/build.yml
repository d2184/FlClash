name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - rs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  FLUTTER_VERSION: '3.50.0'
  NDK_VERSION: r28c
  CA_BUNDLE: cacert-2026-11-05.pem
  CA_BUNDLE_SHA256: 427c064216761a1e72a8b30f0d954d08cb6e4435a82091fb865afd20c8497285

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow runs delete
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Install dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        run: |
          bundle=concord/assets/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Get latest geo database
        run: |
          curl -sSL "https://github.com/d2184/geoip/raw/release/geoip.metadb" -o ./assets/data/GEOIP.metadb
          curl -sSL "https://github.com/d2184/geosite/raw/release/geosite.dat" -o ./assets/data/GEOSITE.dat
          curl -sSL "https://github.com/d2184/geoip/raw/release/GeoLite2-ASN.mmdb" -o ./assets/data/ASN.mmdb
        shell: bash

      - name: Build unsigned APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          version="${version%%+*}"
          dart tool/package.dart android --tag "v${version:?Missing version in pubspec.yaml}" -v

      - name: Display files in directory
        run: |
          ls ./dist

      - name: Sign Apks
        uses: d2184/android-sign@main
        with:
          releaseDirectory: ./dist
          output: ./dist/signed
          buildDirectory: ${{ runner.temp }}
          alias: ${{ secrets.KEY_ALIAS }}
          signingKeyBase64: ${{ secrets.KEYSTORE_CONTENT }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Delete current Prerelease-alpha assets
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: Prerelease-Alpha
          assets: "*.apk"
          fail-if-no-release: false
          fail-if-no-assets: false

      - name: Public
        uses: svenstaro/upload-release-action@master
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: Prerelease-Alpha
          release_name: Prerelease-Alpha
          file: "./dist/signed/*.apk"
          prerelease: true
          overwrite: true
          file_glob: true
