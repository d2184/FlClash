name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  TZ: Asia/Shanghai
  FLUTTER_VERSION: '3.47.6'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow runs delete
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set Core Version
        run: |
          commit_hash=$(git -C core/Clash.Meta rev-parse --short=7 HEAD~3)
          sed -i -E "s/^core_version:.*/core_version: alpha-${commit_hash}/" build_config.yaml
          grep '^core_version:' build_config.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: |
            core/go.sum
          check-latest: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Get latest geo database
        run: |
          curl -sSL "https://github.com/d2184/geoip/raw/release/GeoLite2-ASN.mmdb" -o ./assets/data/ASN.mmdb
          curl -sSL "https://github.com/d2184/geoip/raw/release/geoip.metadb" -o ./assets/data/GEOIP.metadb
          curl -sSL "https://github.com/d2184/geoip/raw/release/geoip.dat" -o ./assets/data/GEOIP.dat
          curl -sSL "https://github.com/d2184/geosite/raw/release/geosite.dat" -o ./assets/data/GEOSITE.dat
        shell: bash

      # The core embeds this bundle and FlClashHttpOverrides.trustCoreRoots loads it for Dart.
      # Pinned by hash, so a new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          dart setup.dart android

      - name: Display files in directory
        run: |
          ls ./dist

      - name: Sign Apks
        if: success()
        uses: d2184/android-sign@main
        with:
          releaseDirectory: ./dist
          output: ./dist/signed
          alias: ${{ secrets.KEY_ALIAS }}
          signingKeyBase64: ${{ secrets.KEYSTORE_CONTENT }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Delete current Prerelease-alpha assets
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: Prerelease-Alpha
          assets: "*.apk"
          fail-if-no-release: false
          fail-if-no-assets: false

      - name: Public
        uses: svenstaro/upload-release-action@master
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: Prerelease-Alpha
          release_name: Prerelease-Alpha
          file: "./dist/signed/*.apk"
          prerelease: true
          overwrite: true
          file_glob: true

